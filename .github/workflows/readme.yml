name: Update profile SVG

on:
  schedule:
    - cron: "0 9 * * *"      # diario, 09:00 UTC (~02:00 en Sonora)
  workflow_dispatch:          # boton manual en la pestana Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/art.txt"
      - ".github/workflows/readme.yml"

permissions:
  contents: write

concurrency:
  group: profile-svg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      - name: Actualizar SVG
        env:
          # ACCESS_TOKEN (PAT fine-grained) incluye repos privados en el conteo.
          # Sin el, usa el token del workflow y solo cuenta lo publico.
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: python scripts/update_svg.py

      - name: Commit si cambio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "Sin cambios."
          else
            git add dark_mode.svg light_mode.svg
            git commit -m "chore: actualizar stats del perfil"
            git pull --rebase -X ours origin main
            git push
          fi
